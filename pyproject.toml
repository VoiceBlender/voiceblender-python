[build-system]
# Pinned below 1.30: newer hatchlings emit ``Metadata-Version: 2.5``, which
# PyPI does not accept yet — twine rejects such a wheel before it is uploaded
# ("'2.5' is not a valid metadata version"). Releases in the 1.27–1.29 range
# emit 2.4. Lift the pin once twine/PyPI accept 2.5 (verify with
# ``make package``, which runs ``twine check``).
requires = ["hatchling<1.30", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "voiceblender"
# Version comes from the git tag — see [tool.hatch.version] below. Tag a
# release as ``vX.Y.Z`` and the built artifact is ``X.Y.Z``; there is no
# version string to bump in this file.
dynamic = ["version"]
description = "Python client for the VoiceBlender API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Messageroute Ltd" }]
keywords = ["voiceblender", "sip", "webrtc", "voice", "telephony"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Telephony",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "ruamel.yaml>=0.18",
    "build>=1.2",
    "twine>=5",
]

[project.urls]
Homepage = "https://voiceblender.com"
Repository = "https://github.com/VoiceBlender/voiceblender-python"

# The distribution version is derived from the git tag (hatch-vcs wraps
# setuptools_scm): tag ``v0.12.1`` builds ``voiceblender-0.12.1``. A commit
# that is not itself tagged builds a dev version like ``0.12.2.dev3+g1a2b3c4``,
# which PyPI rejects — so a release can only be published from a clean tagged
# checkout, which is the intended guard rail (``make release-check``).
#
# Building the wheel from an unpacked sdist works without any git history:
# hatch-vcs falls back to the version recorded in the sdist's PKG-INFO. That is
# the path ``python -m build`` takes by default.
[tool.hatch.version]
source = "vcs"

# Writes the resolved version into the package as _version.py so
# ``voiceblender.__version__`` matches the artifact without a second constant
# to keep in sync. Generated at build time and git-ignored.
[tool.hatch.build.hooks.vcs]
version-file = "src/voiceblender/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceblender"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"src/voiceblender/_models.py" = ["N815"]    # generated: wire-name aliases via Field()
"src/voiceblender/_requests.py" = ["N815"]
"src/voiceblender/_responses.py" = ["N815"]
"src/voiceblender/_events.py" = ["N815"]
"src/voiceblender/_vsi.py" = ["N815"]
"tests/*" = ["N802", "N803"]

[tool.mypy]
strict = true
python_version = "3.10"
plugins = ["pydantic.mypy"]
exclude = ["build/", "dist/"]

[[tool.mypy.overrides]]
module = ["websockets.*", "ruamel.*"]
ignore_missing_imports = true

# Generated modules dynamically bind methods onto Client/Leg/Room/EventStream
# at import time. Strict mypy flags every binding as ``attr-defined`` because
# the receiver class doesn't statically declare the method. Relax the affected
# checks for generated files only — matches the Go SDK's posture of running
# vet on generated files but accepting that the dynamic emission idioms
# don't pass an aggressive linter.
[[tool.mypy.overrides]]
module = [
    "voiceblender._legs",
    "voiceblender._rooms",
    "voiceblender._webrtc",
    "voiceblender._vsi",
]
disable_error_code = [
    "attr-defined",
    "method-assign",
    "unused-ignore",
    "no-any-return",
    "type-arg",
    "assignment",
    "misc",
]
